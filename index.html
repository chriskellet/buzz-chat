<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buzz · Instant Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: oklch(0.13 0.02 280);
    --surface: oklch(0.18 0.02 280);
    --surface-hover: oklch(0.22 0.02 280);
    --border: oklch(0.28 0.02 280);
    --text: oklch(0.92 0.01 280);
    --text-dim: oklch(0.55 0.02 280);
    --accent: oklch(0.72 0.2 160);
    --accent-dim: oklch(0.72 0.2 160 / 0.15);
    --accent-2: oklch(0.75 0.15 300);
    --danger: oklch(0.65 0.2 25);
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  @font-face {
    font-family: 'Inter';
    src: url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  }

  html { height: 100%; height: 100dvh; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Lobby ── */
  #lobby {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    height: 100dvh;
    overflow-y: auto;
    gap: 2rem;
    padding: 2rem;
    animation: fadeIn 0.5s ease;
  }

  .logo {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .logo span { font-size: 2.5rem; -webkit-text-fill-color: initial; }

  .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
    margin-top: -1rem;
    text-align: center;
  }

  .lobby-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .lobby-card label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .lobby-card input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    color: var(--text);
    font-size: 1rem;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.2s;
  }
  .lobby-card input:focus {
    border-color: var(--accent);
  }
  .lobby-card input::placeholder { color: var(--text-dim); opacity: 0.5; }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.5rem;
    color: oklch(0.15 0 0);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.6rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.2s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Chat ── */
  #chat {
    display: none;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
  }
  #chat.active { display: flex; }
  #lobby.hidden { display: none; }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 0.75rem;
  }

  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 0;
  }

  .room-badge {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .peer-count {
    font-size: 0.8rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
  }
  .peer-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .chat-header-right {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--text); }

  .messages {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }

  .messages-inner {
    min-height: 100%;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 0.25rem;
  }

  .msg {
    max-width: 75%;
    animation: msgIn 0.25s ease;
    display: flex;
    flex-direction: column;
  }

  .msg.mine { align-self: flex-end; }
  .msg.theirs { align-self: flex-start; }

  .msg-author {
    font-size: 0.7rem;
    font-weight: 600;
    margin-bottom: 2px;
    padding: 0 0.4rem;
  }
  .msg.mine .msg-author { text-align: right; color: var(--accent); }
  .msg.theirs .msg-author { color: var(--accent-2); }

  .msg-bubble {
    padding: 0.6rem 0.9rem;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.45;
    word-break: break-word;
  }

  .msg.mine .msg-bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: oklch(0.15 0 0);
    border-bottom-right-radius: 4px;
  }

  .msg.theirs .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-time {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 2px;
    padding: 0 0.4rem;
  }
  .msg.mine .msg-time { text-align: right; }
  .msg-status { color: var(--text-dim); font-style: italic; }
  .msg.sending .msg-bubble { opacity: 0.6; }

  .msg-system {
    align-self: center;
    font-size: 0.75rem;
    color: var(--text-dim);
    background: var(--surface);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    margin: 0.5rem 0;
    border: 1px solid var(--border);
  }

  .msg-bubble.emoji-only {
    background: transparent !important;
    border: none !important;
    font-size: 2.5rem;
    line-height: 1.2;
    padding: 0.2rem 0.4rem;
  }

  .load-more {
    align-self: center;
    font-size: 0.75rem;
    color: var(--accent);
    background: var(--surface);
    padding: 0.4rem 1rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: var(--font);
    font-weight: 500;
    transition: all 0.2s;
    margin-bottom: 0.5rem;
    flex-shrink: 0;
  }
  .load-more:hover { border-color: var(--accent); background: var(--accent-dim); }

  .typing-indicator {
    align-self: flex-start;
    padding: 0.5rem 0.8rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    display: none;
    align-items: center;
    gap: 0.4rem;
  }
  .typing-indicator.visible { display: flex; }
  .typing-dots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.32s; }

  .chat-input-area {
    padding: 0.75rem 1rem;
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .chat-input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.7rem 1rem;
    color: var(--text);
    font-size: 16px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input-area input:focus { border-color: var(--accent); }
  .chat-input-area input::placeholder { color: var(--text-dim); opacity: 0.5; }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 20px; height: 20px; }

  .toast {
    position: fixed;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* ── Scrollbar ── */
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Mobile ── */
  @media (max-width: 500px) {
    .msg { max-width: 85%; }
    .logo { font-size: 2.2rem; }
    .lobby-card { padding: 1.5rem; }
  }
</style>
</head>
<body>

<!-- Lobby -->
<div id="lobby">
  <div class="logo"><span>⚡</span> Buzz</div>
  <p class="subtitle">Peer-to-peer encrypted chat. No signup. No server.</p>
  <div class="lobby-card">
    <label>Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Chris" maxlength="24" autocomplete="off">

    <label>Room code</label>
    <input type="text" id="roomInput" placeholder="e.g. friday-standup" maxlength="40" autocomplete="off">

    <button class="btn" id="joinBtn" onclick="joinRoom()">Join Room →</button>

    <div class="divider">or</div>

    <button class="btn-ghost" onclick="generateRoom()">Create random room</button>
  </div>
</div>

<!-- Chat -->
<div id="chat">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="room-badge" id="roomLabel"></div>
      <div class="peer-count">
        <div class="peer-dot"></div>
        <span id="peerCount">1 online</span>
      </div>
    </div>
    <div class="chat-header-right">
      <button class="icon-btn" onclick="copyLink()" title="Copy invite link">🔗</button>
      <button class="icon-btn" onclick="leaveRoom()" title="Leave room">✕</button>
    </div>
  </div>

  <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>

  <div class="typing-indicator" id="typingIndicator">
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span id="typingName">Someone</span> is typing…
  </div>

  <div class="chat-input-area">
    <input type="text" id="msgInput" placeholder="Type a message…" maxlength="2000" autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="oklch(0.15 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──
  var gun, roomRef, myName, myId, roomCode, seenIds = new Set(), typingTimeout;
  var PAGE_SIZE = 50;
  var messageHistory = [];  // full sorted backlog
  var historyOffset = 0;    // how many from the end we've rendered
  const pendingMsgs = new Map();
  const peers = new Map();
  const emojiOnlyRegex = /^(?:\p{Emoji_Presentation}|\p{Emoji}\uFE0F){1,8}$/u;

  // ── Cookie helpers ──
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 86400000);
    document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  // ── Restore returning user ──
  const savedId = getCookie('buzz_user_id');
  const savedName = getCookie('buzz_user_name');
  if (savedName) {
    document.getElementById('nameInput').value = savedName;
  }

  // ── Init ──
  const params = new URLSearchParams(location.search);
  if (params.get('room')) {
    document.getElementById('roomInput').value = params.get('room');
  }

  // Auto-rejoin if returning user has a room in URL
  if (savedId && savedName && params.get('room')) {
    joinRoom();
  } else {
    document.getElementById('nameInput').focus();
  }

  // ── Room helpers ──
  function generateRoom() {
    const words = [
      'alpha','bravo','cedar','delta','echo','frost','gamma','haze',
      'iris','jade','karma','lunar','mango','nova','orbit','pulse',
      'quark','raven','solar','tidal','ultra','viper','warp','xenon',
      'yeti','zen','amber','blitz','coral','drift'
    ];
    const pick = () => words[Math.floor(Math.random() * words.length)];
    document.getElementById('roomInput').value = `${pick()}-${pick()}-${Math.floor(Math.random() * 100)}`;
  }

  function joinRoom() {
    myName = document.getElementById('nameInput').value.trim() || `User-${Math.random().toString(36).slice(2,6)}`;
    roomCode = document.getElementById('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');

    if (!roomCode) {
      generateRoom();
      roomCode = document.getElementById('roomInput').value.trim();
    }

    // Reuse saved identity or create new one
    myId = savedId || crypto.randomUUID();
    setCookie('buzz_user_id', myId, 365);
    setCookie('buzz_user_name', myName, 365);

    // Update URL without reload
    const url = new URL(location.href);
    url.searchParams.set('room', roomCode);
    history.replaceState(null, '', url);

    // Switch views
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('chat').classList.add('active');
    document.getElementById('roomLabel').textContent = `# ${roomCode}`;
    document.getElementById('msgInput').focus();

    initGun();
  }

  function leaveRoom() {
    if (roomRef) {
      roomRef.get('presence').get(myId).put(null);
    }
    location.href = location.pathname;
  }

  // ── Gun.js ──
  let presenceTimer;

  function initGun() {
    gun = Gun({
      peers: [
        'https://relay.peer.ooo/gun',
        'https://gun.o8.is/gun',
      ],
      localStorage: true,
    });

    roomRef = gun.get('buzz-chat-v1').get(roomCode);

    // Announce presence + update peer count together
    const heartbeat = () => {
      roomRef.get('presence').get(myId).put({
        name: myName,
        ts: Date.now(),
      });
      updatePeerCount();
    };
    heartbeat();

    // Heartbeat every 2 minutes — only when tab is visible
    presenceTimer = setInterval(() => {
      if (!document.hidden) heartbeat();
    }, 120000);

    // Clean up on page close
    window.addEventListener('beforeunload', () => {
      roomRef.get('presence').get(myId).put(null);
    });

    // Refresh when tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) heartbeat();
    });

    // Post join message
    addSystemMessage(`You joined as ${myName}`);

    // Listen for messages — buffer during initial load, debounce then sort & paginate
    let initialLoad = true;
    const initialBuffer = [];
    let flushTimer = null;
    const DEBOUNCE_MS = 400;  // flush 400ms after last message arrives
    const MAX_WAIT_MS = 2000; // but never wait longer than 2s total
    const loadStart = Date.now();

    function flushInitialBuffer() {
      if (!initialLoad) return;
      initialLoad = false;
      clearTimeout(flushTimer);

      initialBuffer.sort((a, b) => a.ts - b.ts);
      messageHistory = initialBuffer;

      const start = Math.max(0, messageHistory.length - PAGE_SIZE);
      historyOffset = messageHistory.length - start;

      if (start > 0) showLoadMoreButton();

      for (let i = start; i < messageHistory.length; i++) {
        renderMessage(messageHistory[i], true);
      }
    }

    // Hard deadline — never wait longer than MAX_WAIT_MS
    setTimeout(flushInitialBuffer, MAX_WAIT_MS);

    roomRef.get('messages').map().on((data, id) => {
      if (!data || !data.text) return;
      if (pendingMsgs.has(id)) { confirmMessage(id, data); return; }
      if (seenIds.has(id)) return;
      seenIds.add(id);

      if (initialLoad) {
        initialBuffer.push(data);
        // Debounce: flush shortly after messages stop arriving
        clearTimeout(flushTimer);
        flushTimer = setTimeout(flushInitialBuffer, DEBOUNCE_MS);
      } else {
        // Live message — also add to history for consistency
        messageHistory.push(data);
        historyOffset++;
        renderMessage(data, false);
      }
    });

    // Scroll-to-top detection for loading older messages (debounced)
    let scrollLoadTimer;
    document.getElementById('messages').addEventListener('scroll', () => {
      clearTimeout(scrollLoadTimer);
      scrollLoadTimer = setTimeout(() => {
        const scroller = document.getElementById('messages');
        if (scroller.scrollTop < 50 && historyOffset < messageHistory.length) {
          loadOlderMessages();
        }
      }, 200);
    });

    // Poll for typing every 2s instead of using map().on() which
    // generates continuous relay sync traffic for every stale entry
    setInterval(() => {
      const now = Date.now();
      let someoneTyping = false;
      roomRef.get('typing').map().once((data, peerId) => {
        if (data && peerId !== myId && data.active && now - data.ts < 4000) {
          showTyping(data.name || 'Someone');
          someoneTyping = true;
        }
      });
      setTimeout(() => { if (!someoneTyping) hideTyping(); }, 200);
    }, 2000);

    // Key bindings
    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Typing indicator broadcast — debounce to one put per 2s
    let lastTypingPut = 0;
    document.getElementById('msgInput').addEventListener('input', () => {
      const now = Date.now();
      if (now - lastTypingPut > 2000) {
        lastTypingPut = now;
        roomRef.get('typing').get(myId).put({
          name: myName,
          active: true,
          ts: now,
        });
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        roomRef.get('typing').get(myId).put({ active: false, ts: Date.now() });
      }, 2500);
    });
  }

  // ── Presence ──
  function updatePeerCount() {
    const staleMs = 180000; // 3 minutes
    const now = Date.now();
    roomRef.get('presence').map().once((data, peerId) => {
      if (data && data.ts && now - data.ts < staleMs) {
        peers.set(peerId, data.ts);
      } else {
        peers.delete(peerId);
      }
    });
    setTimeout(() => {
      const cutoff = Date.now() - staleMs;
      for (const [id, ts] of peers) {
        if (ts < cutoff) peers.delete(id);
      }
      const el = document.getElementById('peerCount');
      el.textContent = `${Math.max(1, peers.size)} online`;
    }, 300);
  }

  // ── Pagination ──
  function showLoadMoreButton() {
    const container = document.getElementById('messagesInner');
    if (container.querySelector('.load-more')) return;
    const btn = document.createElement('button');
    btn.className = 'load-more';
    const remaining = messageHistory.length - historyOffset;
    btn.textContent = `Load ${Math.min(PAGE_SIZE, remaining)} older messages`;
    btn.onclick = () => loadOlderMessages();
    container.prepend(btn);
  }

  function loadOlderMessages() {
    const container = document.getElementById('messagesInner');
    const scroller = document.getElementById('messages');

    // Remove existing button
    const btn = container.querySelector('.load-more');
    if (btn) btn.remove();

    const end = messageHistory.length - historyOffset;
    if (end <= 0) return;
    const start = Math.max(0, end - PAGE_SIZE);

    // Preserve scroll position
    const prevHeight = scroller.scrollHeight;

    // Render older batch at top (after system message if present)
    const firstMsg = container.querySelector('.msg');
    for (let i = start; i < end; i++) {
      const el = renderMessageElement(messageHistory[i]);
      if (firstMsg) {
        container.insertBefore(el, firstMsg);
      } else {
        container.appendChild(el);
      }
    }

    historyOffset += (end - start);

    // Restore scroll so content doesn't jump
    scroller.scrollTop = scroller.scrollHeight - prevHeight;

    // Show button if more remain
    if (start > 0) showLoadMoreButton();
  }

  // ── Messaging ──

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    const msgId = `${myId}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    const ts = Date.now();

    // Show optimistic message immediately
    const msgData = { text, author: myName, authorId: myId, ts };
    const el = renderMessage(msgData, false, true);
    pendingMsgs.set(msgId, el);
    seenIds.add(msgId);

    // Auto-confirm after 3s if relay is slow/down
    setTimeout(() => confirmMessage(msgId, msgData), 3000);

    roomRef.get('messages').get(msgId).put(msgData);

    // Clear typing
    roomRef.get('typing').get(myId).put({ active: false, ts: Date.now() });
    input.value = '';
    input.focus();
  }

  function renderMessageElement(data, pending) {
    const isMine = data.authorId === myId;

    const msg = document.createElement('div');
    msg.className = `msg ${isMine ? 'mine' : 'theirs'}${pending ? ' sending' : ''}`;

    const author = document.createElement('div');
    author.className = 'msg-author';
    author.textContent = isMine ? 'You' : data.author;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = data.text;

    // Enlarge emoji-only messages
    if (emojiOnlyRegex.test(data.text.trim())) {
      bubble.classList.add('emoji-only');
    }

    const time = document.createElement('div');
    time.className = 'msg-time';
    if (pending) {
      const status = document.createElement('span');
      status.className = 'msg-status';
      status.textContent = 'Sending\u2026';
      time.appendChild(status);
    } else {
      time.textContent = new Date(data.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    msg.appendChild(author);
    msg.appendChild(bubble);
    msg.appendChild(time);

    return msg;
  }

  function renderMessage(data, forceScroll, pending) {
    const container = document.getElementById('messagesInner');
    const msg = renderMessageElement(data, pending);
    container.appendChild(msg);

    // Auto-scroll if near bottom or during initial load
    const scroller = document.getElementById('messages');
    const isMine = data.authorId === myId;
    const isNearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
    if (isNearBottom || isMine || forceScroll) {
      scroller.scrollTop = scroller.scrollHeight;
    }

    return msg;
  }

  function confirmMessage(msgId, data) {
    const el = pendingMsgs.get(msgId);
    if (!el) return;
    el.classList.remove('sending');
    const time = el.querySelector('.msg-time');
    time.textContent = new Date(data.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    pendingMsgs.delete(msgId);
  }

  function addSystemMessage(text) {
    const container = document.getElementById('messagesInner');
    const el = document.createElement('div');
    el.className = 'msg-system';
    el.textContent = text;
    container.appendChild(el);
  }

  // ── Typing ──
  function showTyping(name) {
    const el = document.getElementById('typingIndicator');
    document.getElementById('typingName').textContent = name;
    el.classList.add('visible');
  }
  function hideTyping() {
    document.getElementById('typingIndicator').classList.remove('visible');
  }

  // ── Utils ──
  function copyLink() {
    const url = new URL(location.href);
    url.searchParams.set('room', roomCode);
    navigator.clipboard.writeText(url.toString()).then(() => toast('Link copied!'));
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  // Enter on room input
  document.getElementById('roomInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinRoom();
  });
  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('roomInput').focus();
  });

  // iOS keyboard viewport fix
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      document.documentElement.style.height = window.visualViewport.height + 'px';
      // Scroll input into view when keyboard opens
      const active = document.activeElement;
      if (active && active.tagName === 'INPUT') {
        requestAnimationFrame(() => active.scrollIntoView({ block: 'nearest' }));
      }
    });
  }
</script>
</body>
</html>
